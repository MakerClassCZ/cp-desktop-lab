# Zephyr's samples/bluetooth/hci_uart on an nRF52840 board with the Adafruit UF2 bootloader, as a
# controller for the desktop port's --ble PORT (see README.md).
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Feather HCI bridge"
# Link after the MBR and SoftDevice the bootloader keeps (the devicetree's code partition).
CONFIG_USE_DT_CODE_PARTITION=y
