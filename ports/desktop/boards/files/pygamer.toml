# A PyGamer's names on the virtual board: circuitpython --board-file boards/files/pygamer.toml
# Its four buttons sit behind a shift register (keypad.ShiftRegisterKeys, as adafruit_pybadger
# reads them): Z, X, Return and Backspace press them. The joystick is two sliders, the light
# sensor one more, the accelerometer a LIS3DH on the virtual I2C bus. The virtual board's display
# stands in for the 160x128 TFT (board.DISPLAY).

[pins]
NEOPIXEL = "GPIO14"
D8 = "GPIO14"
LED = "GPIO15"
D13 = "GPIO15"
LIGHT = "GPIO16"
A7 = "GPIO16"
ACCELEROMETER_INTERRUPT = "GPIO17"
SPEAKER_ENABLE = "GPIO18"
BUTTON_OUT = "GPIO19"
BUTTON_CLOCK = "GPIO20"
BUTTON_LATCH = "GPIO21"
JOYSTICK_X = "GPIO22"
A11 = "GPIO22"
JOYSTICK_Y = "GPIO23"
A10 = "GPIO23"
SD_CS = "GPIO24"

[neopixel]
NEOPIXEL = "5"

[led]
LED = "red"

[analog]
JOYSTICK_X = ""
JOYSTICK_Y = ""
LIGHT = ""

[shiftreg]
BUTTON_OUT = "clock=BUTTON_CLOCK latch=BUTTON_LATCH keys=B,A,START,SELECT"

[i2c]
ACCEL = "lis3dh 0x19"

[board]
machine = "Adafruit PyGamer with samd51j19"    # adafruit_pybadger picks the PyGamer by it
