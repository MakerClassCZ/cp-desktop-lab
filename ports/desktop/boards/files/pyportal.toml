# A PyPortal's names on the virtual board: circuitpython --board-file boards/files/pyportal.toml
# The main window is its 320x240 display (board.DISPLAY), and its resistive touchscreen: a click
# or a drag there is a touch, read through TOUCH_XL, TOUCH_XR, TOUCH_YD and TOUCH_YU as
# adafruit_touchscreen reads them, with the calibration Adafruit's examples use. The light
# sensor and A1/A4 are sliders, GPIO13 its speaker. SCL, SDA and board.I2C() are the virtual I2C
# bus, SCK, MOSI, MISO and board.SPI() the virtual SPI bus, with the microSD card on SD_CS.
# The TFT's parallel bus and the ESP32's UART pins are left out. Its ESP32 (ESP_CS, ESP_BUSY,
# ESP_RESET) is not there yet, so programs that go online through it stop at it.

[pins]
TOUCH_XL = "GPIO0"
TOUCH_XR = "GPIO1"
TOUCH_YD = "GPIO2"
TOUCH_YU = "GPIO3"
D3 = "GPIO4"
A1 = "GPIO4"
D4 = "GPIO5"
A4 = "GPIO5"
LIGHT = "GPIO6"
A2 = "GPIO6"
SPEAKER_ENABLE = "GPIO7"
ESP_CS = "GPIO8"
ESP_BUSY = "GPIO9"
ESP_RESET = "GPIO10"
ESP_GPIO0 = "GPIO11"
NEOPIXEL = "GPIO12"
SPEAKER = "GPIO13"
AUDIO_OUT = "GPIO13"
A0 = "GPIO13"
LED = "GPIO14"
D13 = "GPIO14"
L = "GPIO14"
SD_CS = "GPIO15"
SD_CARD_DETECT = "GPIO16"
TFT_BACKLIGHT = "GPIO17"

[touchscreen]
TOUCH = "resistive TOUCH_XL TOUCH_XR TOUCH_YD TOUCH_YU calibration=5200,59000,5800,57000"

[neopixel]
NEOPIXEL = "1"

[led]
LED = "red"

[analog]
LIGHT = ""
A1 = ""
A4 = ""

[spi]
SD = "sdcard cs=SD_CS"   # its microSD slot: CIRCUITPY-SD.img beside the drive

[board]
ble = "off"  # no Bluetooth on this board
display = "320x240"
machine = "Adafruit PyPortal with samd51j20"   # adafruit_pyportal picks by it
