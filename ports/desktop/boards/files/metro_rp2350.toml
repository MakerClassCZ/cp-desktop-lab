# A Metro RP2350's names on the virtual board: circuitpython --board-file boards/files/metro_rp2350.toml
# Its HSTX DVI output (picodvi.Framebuffer on CKP ... D2N) is the board panel's display DVI; its
# button is Z (pressed = low). The virtual board's 28 pins take the names programs use most: D11
# and above, A4 and A5 and the SD card's SDIO pins are left out (metro.toml has D0-D13).

[pins]
CKP = "GPIO0"
CKN = "GPIO1"
D0P = "GPIO2"
D0N = "GPIO3"
D1P = "GPIO4"
D1N = "GPIO5"
D2P = "GPIO6"
D2N = "GPIO7"
BUTTON = "GPIO8"
NEOPIXEL = "GPIO9"
LED = "GPIO10"
SD_CS = "GPIO11"
A0 = "GPIO12"
A1 = "GPIO14"
A2 = "GPIO15"
A3 = "GPIO16"
D0 = "GPIO17"
D1 = "GPIO18"
D2 = "GPIO19"
D3 = "GPIO20"
D4 = "GPIO21"
D5 = "GPIO22"
D6 = "GPIO23"
D7 = "GPIO24"
D8 = "GPIO25"
D9 = "GPIO26"
D10 = "GPIO27"
RX_D0_SWITCH_LEFT = "GPIO17"
TX_D0_SWITCH_RIGHT = "GPIO17"
TX_D1_SWITCH_LEFT = "GPIO18"
RX_D1_SWITCH_RIGHT = "GPIO18"
D23 = "GPIO10"
BOOT = "GPIO8"
SDIO_DATA3 = "GPIO11"
D20 = "SDA"
D21 = "SCL"

[neopixel]
NEOPIXEL = "1"

[button]
BUTTON = "key=Z"

[led]
LED = "red"

[spi]
SD = "sdcard cs=SD_CS"   # its microSD slot: CIRCUITPY-SD.img beside the drive

[board]
ble = "off"  # no Bluetooth on this board
machine = "Adafruit Metro RP2350 with rp2350b"
