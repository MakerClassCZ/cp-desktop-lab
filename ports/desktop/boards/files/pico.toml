# A Raspberry Pi Pico's names on the virtual board: circuitpython --board-file boards/files/pico.toml
# GPn is the virtual board's pin n, as on the Pico. Mind that pins 0-12 are also the keyboard's
# buttons (a key pressed reads low on its pin) and 13 the speaker; the virtual board has 28 pins,
# so GP28 (A2) is left out. The board panel shows the LED and A0, A1 as sliders.

[pins]
GP0 = "GPIO0"
GP1 = "GPIO1"
GP2 = "GPIO2"
GP3 = "GPIO3"
GP4 = "GPIO4"
GP5 = "GPIO5"
GP6 = "GPIO6"
GP7 = "GPIO7"
GP8 = "GPIO8"
GP9 = "GPIO9"
GP10 = "GPIO10"
GP11 = "GPIO11"
GP12 = "GPIO12"
GP13 = "GPIO13"
GP14 = "GPIO14"
GP15 = "GPIO15"
GP16 = "GPIO16"
GP17 = "GPIO17"
GP18 = "GPIO18"
GP19 = "GPIO19"
GP20 = "GPIO20"
GP21 = "GPIO21"
GP22 = "GPIO22"
GP23 = "GPIO23"
GP24 = "GPIO24"
GP25 = "GPIO25"
GP26 = "GPIO26"
GP27 = "GPIO27"
LED = "GPIO25"
GP26_A0 = "GPIO26"
A0 = "GPIO26"
GP27_A1 = "GPIO27"
A1 = "GPIO27"

[led]
LED = "green"

[analog]
A0 = ""
A1 = ""
