# A Fruit Jam's names on the virtual board: circuitpython --board-file boards/files/fruitjam.toml
# Its DVI output (picodvi.Framebuffer on CKP ... D2N) is the board panel's display DVI; its three
# buttons are 1, 2 and 3 (pressed = low), its five NeoPixels a row. The virtual board's 28 pins
# take the names programs use most: A4, A5, D7, D10 and the SD card's SDIO pins are left out. Its
# ESP32-C6 and its TLV320 DAC are not there, so programs that go online or play through
# adafruit_fruitjam stop at them.

[pins]
CKP = "GPIO0"
CKN = "GPIO1"
D0P = "GPIO2"
D0N = "GPIO3"
D1P = "GPIO4"
D1N = "GPIO5"
D2P = "GPIO6"
D2N = "GPIO7"
BUTTON1 = "GPIO8"
BUTTON2 = "GPIO9"
BUTTON3 = "GPIO10"
NEOPIXEL = "GPIO11"
LED = "GPIO12"
I2S_DIN = "GPIO14"
I2S_BCLK = "GPIO15"
I2S_WS = "GPIO16"
I2S_MCLK = "GPIO17"
SD_CS = "GPIO18"
ESP_CS = "GPIO19"
ESP_BUSY = "GPIO20"
ESP_RESET = "GPIO21"
ESP_IRQ = "GPIO22"
A0 = "GPIO23"
A1 = "GPIO24"
A2 = "GPIO25"
A3 = "GPIO26"
D6 = "GPIO27"
D8 = "TX"
D9 = "RX"
IR = "GPIO12"
BOOT = "GPIO8"
ESP_TX = "TX"
ESP_RX = "RX"
PERIPH_RESET = "GPIO21"
I2S_IRQ = "GPIO22"
SDIO_DATA3 = "GPIO18"

[neopixel]
NEOPIXEL = "5"

[button]
BUTTON1 = "key=1"
BUTTON2 = "key=2"
BUTTON3 = "key=3"

[led]
LED = "red"

[spi]
SD = "sdcard cs=SD_CS"   # its microSD slot: CIRCUITPY-SD.img beside the drive

[board]
ble = "off"  # no Bluetooth on this board
machine = "Adafruit Fruit Jam with rp2350b"
