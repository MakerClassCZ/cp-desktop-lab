# A MacroPad's names on the virtual board: circuitpython --board-file boards/files/macropad.toml
# Its twelve keys are 1 2 3 / Q W E / A S D / Z X C (pressed = low), the encoder turns with - and +
# or the wheel and its button is Space; the twelve NeoPixels under the keys, the 128x64 OLED as
# board.DISPLAY. adafruit_macropad starts on it.

[pins]
KEY1 = "GPIO0"
KEY2 = "GPIO1"
KEY3 = "GPIO2"
KEY4 = "GPIO3"
KEY5 = "GPIO4"
KEY6 = "GPIO5"
KEY7 = "GPIO6"
KEY8 = "GPIO7"
KEY9 = "GPIO8"
KEY10 = "GPIO9"
KEY11 = "GPIO10"
KEY12 = "GPIO11"
LED = "GPIO12"
SPEAKER_ENABLE = "GPIO14"
SPEAKER = "GPIO15"
ENCODER_SWITCH = "GPIO16"
BUTTON = "GPIO16"
ENCODER_A = "GPIO17"
ROTA = "GPIO17"
ENCODER_B = "GPIO18"
ROTB = "GPIO18"
NEOPIXEL = "GPIO19"
OLED_CS = "GPIO20"
OLED_RESET = "GPIO21"
OLED_DC = "GPIO22"

[neopixel]
NEOPIXEL = "3x4"

[button]
KEY1 = "key=1"
KEY2 = "key=2"
KEY3 = "key=3"
KEY4 = "key=Q"
KEY5 = "key=W"
KEY6 = "key=E"
KEY7 = "key=A"
KEY8 = "key=S"
KEY9 = "key=D"
KEY10 = "key=Z"
KEY11 = "key=X"
KEY12 = "key=C"
BUTTON = "key=Space"

[encoder]
ROTA = "b=ROTB"

[led]
LED = "red"

[board]
ble = "off"  # no Bluetooth on this board
display = "128x64"
machine = "Adafruit Macropad RP2040 with rp2040"
